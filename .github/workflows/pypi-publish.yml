# 2026-11-25, additive: publish vlc-check to PyPI when a GitHub release is
# published. Runs ONLY after the operator manually creates a release, and
# uses PyPI Trusted Publishing (OIDC) -- no token stored anywhere. Inert
# until the trusted publisher is configured on PyPI (see RELEASING.md).
name: pypi-publish
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: "Sanity: wheel installs and the CLI grades the demo journal"
        run: |
          python -m venv /tmp/t && /tmp/t/bin/pip install dist/*.whl
          /tmp/t/bin/vlc-check --log docs/examples/demo-accounted.jsonl --adapter adapters/generic-appjsonl.json
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
