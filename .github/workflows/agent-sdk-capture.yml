name: agent-sdk-capture
# Live captures of two agent-SDK trace formats, to score them against VLC-1 the way the
# gateways were scored (branch capture/gateways). Runs ONLY on this branch and ONLY on
# GitHub-hosted runners. No API key: each job runs its SDK against a local mock
# OpenAI-compatible endpoint (capture/scripts/mock_openai.py) with one allowed and one
# refused tool call, and keeps everything it observed; the collect job commits the results
# to capture/runs/ on this branch, because job logs and artifacts are not readable from
# the maintainer's tooling.
on:
  push:
    branches: [capture/agent-sdks]
    paths: ['.github/workflows/agent-sdk-capture.yml', 'capture/scripts/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [openai-agents, otel-genai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: capture ${{ matrix.sdk }}
        env:
          OUT: ${{ github.workspace }}/out
        run: |
          mkdir -p "$OUT"
          timeout 600 bash capture/scripts/${{ matrix.sdk }}.sh || echo "script exit $?" >> "$OUT/${{ matrix.sdk }}/steps.txt"
          echo "runner: $(uname -srm); python $(python3 -V 2>&1); $(date -u +%FT%TZ)" >> "$OUT/${{ matrix.sdk }}/steps.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-${{ matrix.sdk }}
          path: out/
          if-no-files-found: warn
  collect:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: capture/agent-sdks }
      - uses: actions/download-artifact@v4
        with: { path: dl, pattern: cap-*, merge-multiple: true }
      - name: commit results
        run: |
          D=capture/runs/run-$(date -u +%Y%m%dT%H%M%SZ); mkdir -p "$D"
          cp -r dl/. "$D/" 2>/dev/null || true
          find "$D" -type f -size +5M -print -delete
          git config user.name "agent-sdk-capture"; git config user.email "actions@users.noreply.github.com"
          git add capture/runs && git commit -q -m "capture: agent-sdk run $(basename "$D")" && git push -q origin HEAD:capture/agent-sdks
