name: jidec-n65
# Fetch the JIDEC ledger export, entry 66 and its OpenTimestamps proof, and the two Bitcoin
# blocks from two public explorers, to check the n 65 stamped head independently.
# Runs ONLY on branch capture/jidec-n65 on a GitHub-hosted runner; GET requests only.
on:
  push:
    branches: [capture/jidec-n65]
    paths: ['.github/workflows/jidec-n65.yml', 'capture/scripts/jidec_n65.sh']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: fetch
        env: { OUT: '${{ github.workspace }}/out' }
        run: bash capture/scripts/jidec_n65.sh || true
      - name: commit
        if: always()
        run: |
          D=capture/runs/jidec-n65-$(date -u +%Y%m%dT%H%M%SZ); mkdir -p "$D"; cp -r out/. "$D/"
          find "$D" -type f -size +5M -print -delete
          git config user.name "jidec-n65"; git config user.email "actions@users.noreply.github.com"
          git add capture/runs && git commit -q -m "capture: jidec n65 $(basename "$D")" && git push -q origin HEAD:capture/jidec-n65
