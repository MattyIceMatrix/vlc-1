name: vlc-1

on: [push, pull_request]

jobs:
  selftest:
    name: conformance self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Invoked as `bash <script>` rather than `./<script>` on purpose: a repo
      # committed from Windows carries no Unix executable bit, and a CI job that
      # fails on a file mode rather than on a test is a false alarm.
      - name: regenerate the worked examples from their generator
        run: python3 examples/make_examples.py

      - name: the examples must match what is committed
        run: |
          if ! git diff --quiet -- examples; then
            echo "The generator produced different files from the ones committed:"
            git --no-pager diff --stat -- examples
            exit 1
          fi
          echo "generator output matches the committed examples"

      - name: conformance self-test (fails in both directions)
        run: bash selftest.sh

      - name: score the third-party formats
        run: |
          # Asserts each format's levels. This step used to print them with
          # tail -3 and assert nothing, so a change here could not fail CI.
          # Each entry is adapter:log:structural:attested.
          set -e
          bad=0
          # MCP, fab and JIDEC were scored in THIRD-PARTY.md but not asserted
          # here until 2026-09-28, so a change could move them silently.
          for a in otel-otlp-logs:otlp-logs:0:0 k8s-audit:k8s-audit:0:0 \
                   linux-auditd:linux-auditd:0:0 aws-cloudtrail-digest:cloudtrail-digests:0:0 \
                   mcp-toolcall:mcp-toolcall:0:0 mcp-toolcall:mcp-toolcall-partial-host:0:0 \
                   fab-equipment-secsgem:fab-equipment-full:0:0 \
                   fab-equipment-secsgem:fab-equipment-sampled:0:0 \
                   jidec-ledger:jidec-ledger:0:0 jidec-ledger-chained:jidec-ledger-chained:1:1 \
                   jidec-ledger-chained-unbound:jidec-ledger-chained-unbound:0:0 \
                   nvidia-openshell-live:openshell-live-full:0:0 \
                   nvidia-openshell-live:openshell-live-scrubbed:0:0 \
                   agentgateway-live:agentgateway-live-full:0:0 agentgateway-live:agentgateway-live-scrubbed:0:0 \
                   docker-mcp-live:docker-mcp-live-full:0:0 docker-mcp-live:docker-mcp-live-scrubbed:0:0 \
                   contextforge-live:contextforge-live-full:0:0 contextforge-live:contextforge-live-scrubbed:0:0 \
                   lasso-live:lasso-live-full:0:0 lasso-live:lasso-live-scrubbed:0:0 \
                   bifrost-live:bifrost-live-full:0:0 bifrost-live:bifrost-live-scrubbed:0:0 \
                   openai-agents-live:openai-agents-live-full:0:0 \
                   openai-agents-live:openai-agents-live-scrubbed:0:0 \
                   openai-agents-live:openai-agents-live-overflow:0:0 \
                   otel-genai-live:otel-genai-live-full:0:0 otel-genai-live:otel-genai-live-scrubbed:0:0 \
                   falco-live:falco-live-full:0:0 falco-live:falco-live-scrubbed:0:0 \
                   falco-live:falco-live-default:0:0 \
                   tessera-live:tessera-live-full:1:1 tessera-live:tessera-live-scrubbed:0:0 \
                   invinoveritas-ledger-live:invinoveritas-ledger-live-full:0:0 \
                   invinoveritas-ledger-live:invinoveritas-ledger-live-truncated:0:0; do
            IFS=: read -r n f ws wa <<< "$a"
            got=$(python3 conformance.py --log "examples/third-party/$f.jsonl" \
                    --adapter "adapters/$n.json" --json \
                  | python3 -c "import json,sys;r=json.load(sys.stdin);print(r['structural_level'],r['attested_level'])")
            if [ "$got" = "$ws $wa" ]; then echo "ok    $n / $f: structural/attested $got"
            else echo "FAIL  $n / $f: got $got, expected $ws $wa"; bad=1; fi
          done
          # EXT-022. The unbound JIDEC capture (control) is L0 on the log alone and L1 only against the head
          # its operator stamped to Bitcoin in the daily batch (held outside the log).
          got=$(python3 conformance.py --log examples/third-party/jidec-ledger-chained-unbound.jsonl \
                  --adapter adapters/jidec-ledger-chained-unbound.json --json \
                  --expect-head 87613590ae46fe98c85925be2bbf8aafe4262634ffa69a45f94081502f8cc7d4 \
                | python3 -c "import json,sys;r=json.load(sys.stdin);print(r['structural_level'],r['attested_level'])")
          if [ "$got" = "1 1" ]; then echo "ok    jidec-ledger-chained-unbound with its stamped head: structural/attested $got"
          else echo "FAIL  jidec-ledger-chained-unbound with its stamped head: got $got, expected 1 1"; bad=1; fi
          # The bound capture is L1 on the log alone (asserted above) and also against the marker hash a
          # verifier derives from a stamped (n, head): sha256(canon({n, schema, prev_entry_sha256: head, head})).
          got=$(python3 conformance.py --log examples/third-party/jidec-ledger-chained.jsonl \
                  --adapter adapters/jidec-ledger-chained.json --json \
                  --expect-head 1dce7a79c4dd26fee7ae4dd007e232483360efa82669056d3c485ad722fbdd2d \
                | python3 -c "import json,sys;r=json.load(sys.stdin);print(r['structural_level'],r['attested_level'])")
          if [ "$got" = "1 1" ]; then echo "ok    jidec-ledger-chained with the head derived from its stamp: structural/attested $got"
          else echo "FAIL  jidec-ledger-chained with the head derived from its stamp: got $got, expected 1 1"; bad=1; fi
          # The n 65 checkpoint (ledger entry 66, claim 0c3bebf7..., OpenTimestamps proof confirmed in
          # Bitcoin blocks 969240 and 969244, checked against blockstream.info and mempool.space in capture run
          # capture/runs/jidec-n65-20260930T210925Z): the export cut at n 65 with its bound marker is L1 against
          # the stamped marker hash, and the same export cut at n 64 and re-sealed consistently -- L1 on the log
          # alone -- fails against it.
          S65=13d1a8dad24d5b70a5e5b05fc3b7359b14fcfe1f56a1424d8454c371811f36b4
          for t in n65:"1 1" n65-resealed-64:"0 0"; do
            f=${t%%:*}; want=${t#*:}; want=${want//\"/}
            got=$(python3 conformance.py --log "examples/third-party/jidec-ledger-chained-$f.jsonl" \
                    --adapter adapters/jidec-ledger-chained.json --json --expect-head $S65 \
                  | python3 -c "import json,sys;r=json.load(sys.stdin);print(r['structural_level'],r['attested_level'])")
            if [ "$got" = "$want" ]; then echo "ok    jidec-ledger-chained-$f against the n 65 Bitcoin stamp: structural/attested $got"
            else echo "FAIL  jidec-ledger-chained-$f against the n 65 Bitcoin stamp: got $got, expected $want"; bad=1; fi
          done
          # sha256-hex-join: the invinoveritas ledger's head event is signed but not a
          # chain link, so it is L0 on the log alone and L1 only against a head held
          # outside the log (here, the value its signed Nostr head event states).
          IH=04467b72e3231f1deb61e1e15741674e226e3aece0892800d7fc7ace2e7a108d
          for t in full:"1 1" truncated:"0 0"; do
            f=${t%%:*}; want=${t#*:}; want=${want//\"/}
            got=$(python3 conformance.py --log "examples/third-party/invinoveritas-ledger-live-$f.jsonl" \
                    --adapter adapters/invinoveritas-ledger-live.json --json --expect-head $IH \
                  | python3 -c "import json,sys;r=json.load(sys.stdin);print(r['structural_level'],r['attested_level'])")
            if [ "$got" = "$want" ]; then echo "ok    invinoveritas-ledger-live / $f with its signed head: structural/attested $got"
            else echo "FAIL  invinoveritas-ledger-live / $f with its signed head: got $got, expected $want"; bad=1; fi
          done
          # The claim THIRD-PARTY.md makes about each live capture: removing the
          # refused calls' records changes no requirement result at all. (Tessera
          # left this list in 1.4.3-draft: its scrubbed file now scores lower; below.)
          for g in openshell-live:nvidia-openshell-live agentgateway-live docker-mcp-live \
                   contextforge-live lasso-live bifrost-live openai-agents-live otel-genai-live \
                   falco-live; do
            IFS=: read -r f n <<< "$g"; n=${n:-$f}
            r() { python3 conformance.py --log "examples/third-party/$f-$1.jsonl" --adapter "adapters/$n.json" --json \
                  | python3 -c "import json,sys;r=json.load(sys.stdin);print(sorted((k,v['status']) for k,v in r['requirements'].items()))"; }
            if [ "$(r full)" = "$(r scrubbed)" ]; then echo "ok    $f: scrubbed scores identically to full"
            else echo "FAIL  $f: scrubbed and full differ"; bad=1; fi
          done
          # The OpenAI Agents SDK capture with 25 of 29 items dropped by a full
          # BatchTraceProcessor queue scores exactly as the capture without drops.
          r() { python3 conformance.py --log "examples/third-party/openai-agents-live-$1.jsonl" --adapter adapters/openai-agents-live.json --json \
                | python3 -c "import json,sys;r=json.load(sys.stdin);print(sorted((k,v['status']) for k,v in r['requirements'].items()))"; }
          if [ "$(r full)" = "$(r overflow)" ]; then echo "ok    openai-agents-live: overflow scores identically to full"
          else echo "FAIL  openai-agents-live: overflow and full differ"; bad=1; fi
          # Falco with syscall_event_drops at the image defaults: 11694 syscalls dropped
          # and no drop alert in the stream; it scores exactly as the tuned capture.
          r() { python3 conformance.py --log "examples/third-party/falco-live-$1.jsonl" --adapter adapters/falco-live.json --json \
                | python3 -c "import json,sys;r=json.load(sys.stdin);print(sorted((k,v['status']) for k,v in r['requirements'].items()))"; }
          if [ "$(r full)" = "$(r default)" ]; then echo "ok    falco-live: default-config scores identically to full"
          else echo "FAIL  falco-live: default-config and full differ"; bad=1; fi
          # The Tessera log under merkle-tlog (1.4.3-draft, EXT-026): the scrubbed file,
          # one entry removed, must now score LOWER than the full one, and fail VLC-L1-1.
          # Up to 1.4.2-draft the checker had no Merkle mechanism and scored them equal.
          lv() { python3 conformance.py --log "examples/third-party/tessera-live-$1.jsonl" --adapter adapters/tessera-live.json --json \
                 | python3 -c "import json,sys;r=json.load(sys.stdin);print(r['structural_level'],r['requirements']['VLC-L1-1']['status'])"; }
          full=$(lv full); scr=$(lv scrubbed)
          if [ "${scr%% *}" -lt "${full%% *}" ] && [ "${scr#* }" = FAIL ] && [ "${full#* }" = PASS ]; then
            echo "ok    tessera-live: scrubbed (L${scr%% *}, VLC-L1-1 FAIL) scores lower than full (L${full%% *})"
          else echo "FAIL  tessera-live: scrubbed '$scr' does not score lower than full '$full'"; bad=1; fi
          # Tail truncation against a held checkpoint: the size-3 checkpoint's root is an
          # earlier root the full log must extend (--expect-root), and a head it is not.
          R1=d1d2ed1574b70efc82f33f01678111d11e0887d180463251eb52f387a9836519
          H6=8082a0520690ab287e22984de621e3739250545056d715c15e0e6d773ba7318e
          if python3 conformance.py --log examples/third-party/tessera-live-full.jsonl --adapter adapters/tessera-live.json \
               --expect-root $R1 --expect-head $H6 --expect-structural 1 > /dev/null \
             && ! python3 conformance.py --log examples/third-party/tessera-live-full.jsonl --adapter adapters/tessera-live.json \
               --expect-head $R1 --expect-structural 1 > /dev/null 2>&1; then
            echo "ok    tessera-live: held checkpoints (size 3 as root, size 6 as head) anchor it; size 3 as head refused"
          else echo "FAIL  tessera-live: held-checkpoint anchoring"; bad=1; fi
          # The same checks outside conformance.py: the raw log and its proofs verify,
          # the full JSONL verifies, and the scrubbed JSONL must fail.
          t=examples/third-party/tessera-live
          if python3 $t/verify_tlog.py log $t/log $t/log.vkey $t/checkpoint.round1 --proofs $t/verify.jsonl > /dev/null \
             && python3 $t/verify_tlog.py jsonl examples/third-party/tessera-live-full.jsonl $t/log.vkey > /dev/null; then
            echo "ok    tessera-live: log, proofs and full JSONL verify outside the checker"
          else echo "FAIL  tessera-live: log, proofs or full JSONL do not verify"; bad=1; fi
          if python3 $t/verify_tlog.py jsonl examples/third-party/tessera-live-scrubbed.jsonl $t/log.vkey > /dev/null; then
            echo "FAIL  tessera-live: scrubbed JSONL verified"; bad=1
          else echo "ok    tessera-live: scrubbed JSONL rejected outside the checker"; fi
          # The invinoveritas ledger chain (head = sha256(content_hash|prev_head)) is also
          # checked outside conformance.py, which recomputes it (sha256-hex-join) but does not
          # verify the head event's signature: the full file verifies against its signed
          # Nostr head, the file with the newest entry dropped -- which the checker scores as
          # the full one on the log alone -- must fail, and every mutation must be caught
          # once the signed head is present.
          t=examples/third-party/invinoveritas-ledger-live
          if python3 $t/verify_ledger.py jsonl examples/third-party/invinoveritas-ledger-live-full.jsonl > /dev/null; then
            echo "ok    invinoveritas-ledger-live: chain and signed head verify outside the checker"
          else echo "FAIL  invinoveritas-ledger-live: full JSONL does not verify"; bad=1; fi
          if python3 $t/verify_ledger.py jsonl examples/third-party/invinoveritas-ledger-live-truncated.jsonl > /dev/null; then
            echo "FAIL  invinoveritas-ledger-live: truncated JSONL verified"; bad=1
          else echo "ok    invinoveritas-ledger-live: truncated JSONL rejected outside the checker"; fi
          if python3 $t/verify_ledger.py jsonl examples/third-party/invinoveritas-ledger-live-full.jsonl --mutations --json \
             | python3 -c "import json,sys;m=json.load(sys.stdin)['mutations'];sys.exit(0 if all(v['detected'] for k,v in m.items() if 'with the Nostr head' in k) else 1)"; then
            echo "ok    invinoveritas-ledger-live: every mutation caught with the signed head"
          else echo "FAIL  invinoveritas-ledger-live: a mutation passed with the signed head"; bad=1; fi
          r() { python3 conformance.py --log "examples/third-party/invinoveritas-ledger-live-$1.jsonl" --adapter adapters/invinoveritas-ledger-live.json --json \
                | python3 -c "import json,sys;r=json.load(sys.stdin);print(sorted((k,v['status']) for k,v in r['requirements'].items()))"; }
          if [ "$(r full)" = "$(r truncated)" ]; then echo "ok    invinoveritas-ledger-live: truncated scores identically to full in the checker"
          else echo "FAIL  invinoveritas-ledger-live: truncated and full differ in the checker"; bad=1; fi
          exit $bad

  proof:
    name: Coq development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's packaged coq rather than a container image: the coqorg images
      # put coqc behind an opam environment owned by a non-root user, which
      # fights with the checkout step for no benefit here.
      - name: install Coq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends coq
          coqc --version

      - name: compile every development
        run: |
          cd proofs
          # EXT-019: this step named one file by hand while SPEC.md cited two.
          # It compiles all of them now, and fails if there are none.
          shopt -s nullglob
          found=0
          for f in *.v; do found=1; echo "--- coqc $f"; coqc -q -Q . Sentinel "$f"; done
          [ "$found" = "1" ] || { echo "no proof developments found"; exit 1; }

      - name: every result must be closed under the global context
        run: |
          cd proofs
          # Audits every Theorem, Lemma and Corollary in every development, under the
          # same logical path the compile step uses (-Q . Sentinel). Sections add no
          # prefix, so each result is Sentinel.<file>.<name>. The closed count must
          # equal the number of results audited, so a result that fails to print
          # cannot pass silently.
          shopt -s nullglob
          : > _audit.v
          audited=0
          for f in *.v; do
            [ "$f" = "_audit.v" ] && continue
            m="${f%.v}"
            printf 'Require Import Sentinel.%s.\n' "$m" >> _audit.v
            for name in $(grep -oE '^[[:space:]]*(Theorem|Lemma|Corollary)[[:space:]]+[A-Za-z_0-9]+' "$f" | awk '{print $2}'); do
              printf 'Print Assumptions Sentinel.%s.%s.\n' "$m" "$name" >> _audit.v
              audited=$((audited+1))
            done
          done
          coqc -q -Q . Sentinel _audit.v > _audit.out 2>&1 || { cat _audit.out; exit 1; }
          cat _audit.out
          closed=$(grep -c 'Closed under the global context' _audit.out || true)
          other=$(grep -vc 'Closed under the global context' _audit.out || true)
          echo "audited: $audited   closed: $closed   anything else: $other"
          test "$audited" -gt 0
          test "$other" = "0"
          test "$closed" = "$audited"

      - name: no admitted proofs, no axioms
        run: |
          cd proofs
          # Written as `! grep ...` until 2026-09-28, which could not fail: bash -e
          # ignores the status of a command negated with `!`, so the step printed
          # any match and passed (EXT-021). It also matched Admitted only at the
          # start of a line, which the usual `Proof. Admitted.` is not.
          # Hypothesis/Variable are not flagged: inside a Section they are
          # discharged when it closes, and the audit above proves every result closed.
          if grep -nwE 'Admitted|admit' *.v; then echo "admitted proof found"; exit 1; fi
          if grep -nE '^[[:space:]]*(Axiom|Axioms|Parameter|Parameters|Conjecture)[[:space:]]' *.v; then
            echo "axiom found"; exit 1
          fi
          echo "0 admitted, 0 axioms"
