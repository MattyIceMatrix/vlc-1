="18" r="5" fill="#28c840"/><text x="72" y="22" fill="#8b949e">invinoveritas verdict ledger (positive control)</text><text class="l0" x="16" y="58" fill="#e6edf3">$ python3 conformance.py --log invinoveritas-ledger-live-full.jsonl --adapter adapters/invinoveritas-ledger-live.json</text><text class="l1" x="16" y="77" fill="#c9d1d9">  structural L0   attested L0   11 of 19 requirements fail</text><text class="l2" x="16" y="96" fill="#8b949e">  first failure: VLC-L1-3 not established: the end marker names the recomputed head, but the adapter declares it not …</text><text class="l3" x="16" y="115" fill="#e6edf3">$ diff invinoveritas-ledger-live-full.jsonl invinoveritas-ledger-live-truncated.jsonl</text><text class="l4" x="16" y="134" fill="#ff7b72">- {"class":"ledger-entry","entry":269,"content_hash":"ae6936f15c9180a32d10110f121710eb434a5fffec51bcbc9922fa5e122b57a…</text><text class="l5" x="16" y="153" fill="#e6edf3">$ python3 conformance.py --log invinoveritas-ledger-live-truncated.jsonl --adapter adapters/invinoveritas-ledger-live…</text><text class="l6" x="16" y="172" fill="#c9d1d9">  structural L0   attested L0   11 of 19 requirements fail</text><text class="l7" x="16" y="191" fill="#f85149">  SAME RESULT as 'log alone': the change is invisible to this check</text><text class="l8" x="16" y="210" fill="#e6edf3">$ python3 conformance.py --log invinoveritas-ledger-live-full.jsonl --adapter adapters/invinoveritas-ledger-live.json…</text><text class="l9" x="16" y="229" fill="#c9d1d9">  structural L1   attested L1   10 of 19 requirements fail</text><text class="l10" x="16" y="248" fill="#d2a8ff">  changed: VLC-L1-3 FAIL→PASS</text><text class="l11" x="16" y="267" fill="#e6edf3">$ python3 conformance.py --log invinoveritas-ledger-live-truncated.jsonl --adapter adapters/invinoveritas-ledger-live…</text><text class="l12" x="16" y="286" fill="#c9d1d9">  structural L0   attested L0   12 of 17 requirements fail</text><text class="l13" x="16" y="305" fill="#3fb950">  CAUGHT: VLC