irements fail</text><text class="l2" x="16" y="96" fill="#8b949e">  first failure: VLC-L2-2 adapter names no loss-declaration class</text><text class="l3" x="16" y="115" fill="#e6edf3">$ diff tessera-live-full.jsonl tessera-live-scrubbed.jsonl</text><text class="l4" x="16" y="134" fill="#ff7b72">- {"class":"entry","data":"{\"event\":\"tool_call\",\"tool\":\"delete_file\",\"args\":{\"path\":\"notes.txt\"},\"deci…</text><text class="l5" x="16" y="153" fill="#e6edf3">$ python3 conformance.py --log tessera-live-scrubbed.jsonl --adapter adapters/tessera-live.json</text><text class="l6" x="16" y="172" fill="#c9d1d9">  structural L0   attested L0   10 of 15 requirements fail</text><text class="l7" x="16" y="191" fill="#3fb950">  CAUGHT: VLC-L1-1 PASS→FAIL, VLC-L2-1 PASS→FAIL (and 8 later checks no longer reached)</text><text class="l8" x="16" y="210" fill="#e6edf3">$ python3 conformance.py --log tessera-live-full.jsonl --adapter adapters/tessera-live.json --expect-root d1d2ed1574b…</text><text class="l9" x="16" y="229" fill="#c9d1d9">  structural L1   attested L1   10 of 23 requirements fail</text><text class="l10" x="16" y="248" fill="#8b949e">  same result as 'as captured'</text></svg>